<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{TITLE_KO}} — 전체 번역본</title>
<script>
  /* 저장된 테마를 그리기 전에 적용 — 새로고침 시 화면 깜빡임 방지 */
  (function(){try{var t=localStorage.getItem('ps-theme');
    if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<script>
  MathJax = { tex: { inlineMath: [['\\(','\\)']], displayMath: [['\\[','\\]'],['$$','$$']] },
              options:{ skipHtmlTags:['script','noscript','style','textarea','pre'] } };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
{{CSS}}
</style>
</head>
<body>
<nav class="topnav">
  <span class="paper-title">{{TITLE_KO}}</span>
  <div class="nav-links">
    <a href="번역본.html" class="active">📄 전체 번역본</a>
    <a href="요약본.html">📋 핵심 요약본</a>
  </div>
  <button type="button" id="theme-toggle" class="theme-toggle" aria-label="다크 모드로 전환" title="다크 모드로 전환">🌙</button>
</nav>
<div class="wrap">
  <h1>{{TITLE_KO}}</h1>
  <div class="meta">{{AUTHORS}} · {{VENUE_YEAR}}</div>
  <div class="orig">원제: {{TITLE_ORIGINAL}}</div>
  <hr>
  <!-- 본문: 논문 전체를 섹션 순서대로 한국어 번역.
       그림 = <figure><img src="images/..."><figcaption>그림 N. 캡션</figcaption></figure>
       표   = <div class="table-wrap"><table>...</table></div>
       수식 = 인라인 \( ... \) / 디스플레이 \[ ... \] (MathJax) -->
{{BODY}}
</div>
<footer>이 문서는 원문 PDF를 한국어로 번역한 것입니다 · paper-summary 스킬로 자동 생성</footer>
<script>
/* 다크 모드 전환 버튼 — 시스템 설정 → 버튼으로 덮어쓰기, 선택은 브라우저에 기억된다 */
(function(){
  var root = document.documentElement;
  var btn  = document.getElementById('theme-toggle');
  if(!btn) return;
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme:dark)') : null;
  function current(){
    var t = root.getAttribute('data-theme');
    if(t === 'dark' || t === 'light') return t;
    return (mq && mq.matches) ? 'dark' : 'light';
  }
  function paint(){
    var dark = current() === 'dark';
    btn.textContent = dark ? '☀️' : '🌙';
    btn.setAttribute('aria-label', dark ? '라이트 모드로 전환' : '다크 모드로 전환');
    btn.title = btn.getAttribute('aria-label');
  }
  btn.addEventListener('click', function(){
    var next = current() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try{ localStorage.setItem('ps-theme', next); }catch(e){}
    paint();
  });
  if(mq && mq.addEventListener) mq.addEventListener('change', paint);
  paint();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{TITLE_KO}} — 용어 사전</title>
<script>
  /* 저장된 테마를 그리기 전에 적용 — 새로고침 시 화면이 번쩍이지 않게 한다 */
  (function(){try{var t=localStorage.getItem('ps-theme');
    if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<script>
  MathJax = { tex: { inlineMath: [['\\(','\\)']], displayMath: [['\\[','\\]'],['$$','$$']] },
              options:{ skipHtmlTags:['script','noscript','style','textarea','pre'] } };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
{{CSS}}
</style>
</head>
<body>
<nav class="topnav">
  <span class="paper-title">{{TITLE_KO}}</span>
  <div class="nav-links">
    <a href="번역본.html">전체 번역본</a>
    <a href="요약본.html">핵심 요약본</a>
    <a href="용어사전.html" class="active">용어 사전</a>
  </div>
  <button type="button" id="theme-toggle" class="theme-toggle" aria-label="다크 모드로 전환" title="다크 모드로 전환">
    <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.6A8.6 8.6 0 0 1 9.4 4 8.6 8.6 0 1 0 20 14.6Z"/></svg>
    <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M21.4 12h-2.2M4.8 12H2.6M18.6 5.4 17 7M7 17l-1.6 1.6M18.6 18.6 17 17M7 7 5.4 5.4"/></svg>
  </button>
</nav>
<div class="wrap wide">
  <h1>{{TITLE_KO}} — 용어 사전</h1>
  <p class="orig">{{TITLE_ORIGINAL}}</p>
  <div class="meta">{{AUTHORS}} · {{VENUE_YEAR}}</div>
  <hr>
  <p>이 논문에 나오는 전문 용어와 약어를 한국어 정의와 함께 정리했습니다. 한글·영어·약어 어느 쪽으로도 검색할 수 있습니다.</p>
  <input type="text" id="glossary-search" class="glossary-search" placeholder="용어 검색 — 한글, 영어, 약어 모두 가능" oninput="filterGlossary()">
  <p class="glossary-count" id="glossary-count"></p>
  <dl class="glossary">
{{GLOSSARY}}
  </dl>
  <p class="more"><a href="번역본.html">전체 번역본 보기 →</a></p>
</div>
<footer>용어 사전 · paper-summary 스킬로 생성</footer>
<script>
function filterGlossary(){
  var q = document.getElementById('glossary-search').value.trim().toLowerCase();
  var items = document.querySelectorAll('.glossary > .term');
  var shown = 0;
  items.forEach(function(it){
    var hay = (it.getAttribute('data-terms') || it.textContent).toLowerCase();
    var match = q === '' || hay.indexOf(q) !== -1;
    it.style.display = match ? '' : 'none';
    if (match) shown++;
  });
  document.getElementById('glossary-count').textContent =
    q === '' ? (items.length + '개 용어') : (shown + ' / ' + items.length + '개 일치');
}
document.addEventListener('DOMContentLoaded', filterGlossary);
</script>
<script>
/* 테마 버튼 — 아이콘 전환은 CSS 가 하고, 여기서는 상태와 설명만 바꾼다 */
(function(){
  var root = document.documentElement, btn = document.getElementById('theme-toggle');
  if(!btn) return;
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme:dark)') : null;
  function current(){
    var t = root.getAttribute('data-theme');
    return (t === 'dark' || t === 'light') ? t : ((mq && mq.matches) ? 'dark' : 'light');
  }
  function label(){
    var s = current() === 'dark' ? '라이트 모드로 전환' : '다크 모드로 전환';
    btn.setAttribute('aria-label', s); btn.title = s;
  }
  btn.addEventListener('click', function(){
    var next = current() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try{ localStorage.setItem('ps-theme', next); }catch(e){}
    label();
  });
  if(mq && mq.addEventListener) mq.addEventListener('change', label);
  label();
})();
</script>
</body>
</html>
